<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>幻想次元旅馆歌单</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <nav class="nav">
          <button id="sidebarToggle" class="nav__iconbtn" type="button" aria-haspopup="dialog" aria-expanded="false" title="筛选" aria-label="筛选">
            ☰
          </button>
          <button id="navLibrary" class="nav__btn" type="button" aria-pressed="true">歌单库</button>
          <button id="navWeekly" class="nav__btn" type="button" aria-pressed="false">每周新增</button>
          <button id="navDashboard" class="nav__btn" type="button" aria-pressed="false">数据看板</button>
        </nav>

        <!-- 顶部操作区已移除：站点以静态数据为主 -->
      </header>

      <div id="notice" class="notice" hidden></div>

      <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>
      <aside id="sidebar" class="sidebar">
        <div class="sidebar__head">
          <div class="sidebar__title">筛选</div>
          <button id="sidebarClose" class="sidebar__close" type="button" aria-label="关闭筛选" title="关闭">✕</button>
        </div>
        <div class="panel">
          <div class="panel__title">歌单</div>
          <div id="playlistList" class="playlist-list">
            <div class="muted">请先导入 `songs.txt`</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel__title">标签</div>
          <div id="genreChips" class="chip-row"></div>
        </div>

        <div class="panel">
          <div class="panel__title">搜索</div>
          <input id="searchInput" class="input" type="search" placeholder="搜索：歌名 / 歌手 / 歌单 / 标签" disabled />
          <div class="row row--wrap" style="margin-top:10px">
            <select id="sortSelect" class="select" disabled>
              <option value="playlist:asc">按歌单（A→Z）</option>
              <option value="playlist:desc">按歌单（Z→A）</option>
              <option value="name:asc">按歌名（A→Z）</option>
              <option value="name:desc">按歌名（Z→A）</option>
              <option value="artist:asc">按歌手（A→Z）</option>
              <option value="artist:desc">按歌手（Z→A）</option>
              <option value="tags:desc">按标签数量（多→少）</option>
              <option value="tags:asc">按标签数量（少→多）</option>
              <option value="updated:desc">按标签更新时间（新→旧）</option>
              <option value="updated:asc">按标签更新时间（旧→新）</option>
            </select>
          </div>
        </div>
      </aside>

      <main class="main">
        <div id="libraryView" class="panel panel--main">
          <div class="panel__title">
            <span id="currentTitle">未导入</span>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th style="width: 38%">歌曲名</th>
                  <th style="width: 28%">歌手</th>
                  <th style="width: 16%">歌单</th>
                  <th style="width: 18%">标签</th>
                </tr>
              </thead>
              <tbody id="songTbody">
                <tr>
                  <td colspan="4" class="muted">导入 `songs.txt` 后会显示列表。</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div id="weeklyView" class="panel panel--main" hidden>
          <div class="panel__title">
            <span>每周新增</span>
            <span id="weeklySubtitle" class="muted"></span>
          </div>
          <div id="weeklyGrid" class="weekly-grid">
            <div class="muted">未检测到 `web/newsongs.json`。你可以先运行生成脚本，再刷新页面。</div>
          </div>
        </div>

        <div id="dashboardView" class="panel panel--main" hidden>
          <div class="dash-grid">
            <div class="dash-card">
              <div class="dash-card__title">热度 Top（来自喵喵机器人）</div>
              <div id="heatTopList" class="rank-list muted">未加载到热度数据</div>
              <div id="heatNote" class="muted" style="margin-top:10px;font-size:12px"></div>
            </div>
            <div class="dash-card">
              <div class="dash-card__title">Top 标签（雷达）</div>
              <canvas id="chartTagRadar" height="220"></canvas>
            </div>
            <div class="dash-card dash-card--wide">
              <div class="dash-card__title">评论（来自喵喵机器人）</div>
              <div class="row row--wrap" style="margin-bottom:10px">
                <input id="commentSearch" class="input" type="search" placeholder="搜索评论：歌名/歌手/评论/昵称" />
                <button id="commentRefresh" class="btn btn--ghost" type="button">刷新随机两条</button>
              </div>
              <div id="commentList" class="comment-list muted">未加载到评论数据</div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <dialog id="imageDialog" class="dialog">
      <form method="dialog" class="dialog__card dialog__card--img">
        <div class="dialog__title">每周新增</div>
        <div id="imageDialogSubtitle" class="dialog__subtitle muted"></div>
        <div class="dialog__body">
          <img id="imageDialogImg" class="img-preview" alt="weekly new songs" />
        </div>
        <div class="dialog__actions">
          <button class="btn btn--ghost" value="close">关闭</button>
        </div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
